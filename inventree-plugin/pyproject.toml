[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-kicad-assembly"
version = "0.1.1"
description = "Assemble a PCB against an InvenTree Build Order with InteractiveHtmlBom, consuming stock as parts are placed"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sam Turner" }]
keywords = ["inventree", "kicad", "pcb", "bom", "assembly", "electronics"]

[project.entry-points."inventree_plugins"]
KicadAssemblyPlugin = "inventree_kicad_assembly_panel.core:KicadAssemblyPlugin"

[tool.setuptools.packages.find]
include = ["inventree_kicad_assembly_panel*"]

[tool.setuptools.package-data]
# Compiled Vite output; built from frontend/, not checked in.
inventree_kicad_assembly_panel = ["static/*"]
